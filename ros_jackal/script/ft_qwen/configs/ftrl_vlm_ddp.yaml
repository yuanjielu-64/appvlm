# FTRL配置文件 - VLM+DPT + TD3 for DDP
#
# 用途: 基于预训练VLM+DPT进行强化学习微调
# 算法: TD3 (Twin Delayed DDPG)
# 规划器: DDP (Differential Dynamic Programming)

env_config:
  env_id: "ddp_param-v0"
  save_path: "../logging/"
  seed: 1
  stack_frame: 1  # VLM使用RGB图像，不需要stack
  use_condor: false
  shaping_reward: true
  use_pretrain: null  # 如果要继续训练已有checkpoint，设置为路径

  kwargs:
    world_name: "BARN"
    gui: false
    action_type: "DDP"  # DWA, TEB, MPPI, DDP

training_config:
  algorithm: "TD3_FTRL_VLM_DDP"

  # ===== Debug配置 =====
  debug_use_cpu: true  # Debug模式：使用CPU避免显存不足（推理会慢，但可以debug）

  # ===== VLM+DPT配置 =====
  # 重要: 修改为你的checkpoint路径
  vlm_checkpoint_path: "/home/yuanjielu/robot_navigation/noetic/appvlm_ws/src/ros_jackal/model/ddp/checkpoint-5000"

  # ===== 冻结策略 (独立控制VLM、DPT、History Encoder) =====
  # Actor部分 - 全部冻结，只训练TD3的Critic和噪声网络
  freeze_vlm_actor: true          # VLM冻结
  freeze_dpt_actor: true          # DPT冻结
  freeze_history_actor: true      # History Encoder冻结

  # Critic部分 (共享Actor的feature extractor，所以这些参数实际不生效)
  freeze_dpt_critic: true         # 保留用于兼容性

  # ===== 学习率 (VLM微调需要更小的lr) =====
  actor_lr: 1.0e-5   # 比APPLR小10倍 (APPLR: 3e-4)
  critic_lr: 3.0e-4

  # ===== Buffer配置 =====
  buffer_size: 1000000

  # ===== TD3超参数 =====
  policy_args:
    gamma: 0.99           # 折扣因子
    tau: 0.005            # 软更新系数
    policy_noise: 0.2     # 目标策略平滑噪声
    noise_clip: 0.5       # 噪声裁剪
    n_step: 4             # N-step return
    update_actor_freq: 2  # Actor延迟更新频率
    exploration_noise: 0.1

  # ===== 探索噪声 (VLM预训练好了，可以减少探索) =====
  exploration_noise_start: 0.05  # 起始噪声 (APPLR: 0.1)
  exploration_noise_end: 0.01    # 结束噪声

  # ===== 预收集和日志 =====
  pre_collect: 10000      # 预收集经验数
  log_intervals: 10       # 日志间隔
  use_actor: 1            # 使用的actor数量

  # ===== 训练参数 =====
  training_args:
    max_step: 1000000         # 总训练步数
    collect_per_step: 1000    # 每次收集步数
    update_per_step: 50       # 每次收集后更新次数
    batch_size: 256           # 批大小

# ===== FTRL 数据收集配置 =====
ftrl_config:
  # 服务器列表 (预先在 192.168.1.175 上启动的FTRL服务器)
  server_urls:
    - "http://192.168.1.175:6000"
    - "http://192.168.1.175:6001"
    - "http://192.168.1.175:6002"
    - "http://192.168.1.175:6003"
    - "http://192.168.1.175:6004"
    - "http://192.168.1.175:6005"
    - "http://192.168.1.175:6006"
    - "http://192.168.1.175:6007"

  # 环境分配 (每个server对应的环境列表，逗号分隔)
  world_assignments:
    - "0,8,16,24,32,40,48,56,64,72"      # Actor 0 -> Server 6000
    - "1,9,17,25,33,41,49,57,65,73"      # Actor 1 -> Server 6001
    - "2,10,18,26,34,42,50,58,66,74"     # Actor 2 -> Server 6002
    - "3,11,19,27,35,43,51,59,67,75"     # Actor 3 -> Server 6003
    - "4,12,20,28,36,44,52,60,68,76"     # Actor 4 -> Server 6004
    - "5,13,21,29,37,45,53,61,69,77"     # Actor 5 -> Server 6005
    - "6,14,22,30,38,46,54,62,70,78"     # Actor 6 -> Server 6006
    - "7,15,23,31,39,47,55,63,71,79"     # Actor 7 -> Server 6007

# ===== 使用说明 =====
# 1. 修改 vlm_checkpoint_path 为你的VLM+DPT checkpoint路径
# 2. 运行训练:
#    cd /path/to/ros_jackal
#    python rlft/train.py \
#      --config_path script/ft_qwen/configs/ \
#      --config_file ftrl_vlm_ddp \
#      --buffer_path buffer/ftrl_vlm_ddp \
#      --logging_path logging/ftrl_vlm_ddp
